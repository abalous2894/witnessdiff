services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: witnessdiff
      POSTGRES_PASSWORD: witnessdiff
      POSTGRES_DB: witnessdiff
    # No host port: API reaches Postgres on the compose network (avoids 5433 conflicts).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U witnessdiff -d witnessdiff"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - witnessdiff_pgdata:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "${WITNESSDIFF_HOST_API_PORT:-8081}:8080"
    environment:
      DATABASE_URL: postgresql://witnessdiff:witnessdiff@db:5432/witnessdiff
      WITNESSDIFF_FIXTURES_ROOT: /app/fixtures
      WITNESSDIFF_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost
    depends_on:
      db:
        condition: service_healthy

  viewer:
    build:
      context: .
      dockerfile: apps/viewer/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  witnessdiff_pgdata:
