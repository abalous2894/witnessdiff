name: regression

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests

      - name: Pytest
        run: pytest -q

      - name: Evidence fixture suite
        run: witnessdiff run-evidence-suite

      - name: Behavioral fixture suite
        run: witnessdiff run-behavioral-suite

      - name: All suites vs committed baselines
        run: witnessdiff run-all-suites
