# Render blueprint — optional split deploy for public demo
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: witnessdiff-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: witnessdiff-db
          property: connectionString
      - key: WITNESSDIFF_FIXTURES_ROOT
        value: /app/fixtures
      - key: WITNESSDIFF_CORS_ORIGINS
        value: https://witnessdiff-viewer.onrender.com

  - type: web
    name: witnessdiff-viewer
    runtime: docker
    dockerfilePath: ./apps/viewer/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: WITNESSDIFF_API_HOST
        value: witnessdiff-api

databases:
  - name: witnessdiff-db
    plan: free
