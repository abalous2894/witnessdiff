server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        proxy_pass http://api:8080/health;
    }

    location /v1/ {
        proxy_pass http://api:8080/v1/;
    }
}
